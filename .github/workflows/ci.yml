name: CI
on:
  push:
  pull_request:
permissions: {}
jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run test suite
        run: python -m pytest tests -q
      - name: Verify CLI demonstration
        run: python -m clonepeek examples/suspicious --format json
      - name: Verify Claude Code hook demonstration
        run: python -m clonepeek examples/claude-hooks --format json
      - name: Verify Cursor/Claude combined demonstration
        run: python -m clonepeek examples/agent-hooks --format json
      - name: Verify non-executing referenced-script demonstration
        run: python -m clonepeek examples/indirect-script --format json
      - name: Evaluate labeled synthetic fixtures
        run: python -m evaluation.evaluate --format text
      - name: Build sdist and wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install build
          python -m build
