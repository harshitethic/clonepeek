[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clonepeek"
version = "0.2.1"
description = "Know what runs before you open a repository. An offline first-run execution surface auditor."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Harshit Sharma"}]
license = "MIT"
keywords = ["security", "developer-tools", "supply-chain", "vscode", "cli", "devcontainer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.scripts]
clonepeek = "clonepeek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
